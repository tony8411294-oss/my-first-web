<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YouTube Music Style Player</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
    overflow:hidden;
}

/* 背景模糊層 */
.bg{
    position:absolute;
    inset:0;
    background:url("cover.jpg") center/cover no-repeat;
    filter:blur(30px) brightness(0.4);
    transform:scale(1.2);
}

/* 主容器 */
.app{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* ===== 上半 ===== */
.top{
    padding:60px 24px 10px;
    text-align:center;
}

.cover{
    width:72vw;
    max-width:320px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:18px;
    background:url("cover.jpg") center/cover no-repeat;
    box-shadow:0 25px 60px rgba(0,0,0,0.6);
    transition:0.3s;
}

.playing .cover{
    transform:scale(1.03);
}

/* 標題 */
.title{
    margin-top:18px;
    font-size:22px;
    font-weight:600;
}

.artist{
    font-size:13px;
    opacity:0.6;
    margin-top:4px;
}

/* ===== 進度條 ===== */
.progress{
    padding:0 24px;
}

input[type=range]{
    width:100%;
    accent-color:#ff4d2d;
}

/* ===== 控制列（YouTube Music風） ===== */
.controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px 40px;
}

button{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
    opacity:0.85;
    cursor:pointer;
}

button:hover{
    opacity:1;
}

/* 中間播放鍵 */
.play{
    width:68px;
    height:68px;
    border-radius:50%;
    background:linear-gradient(145deg,#ff4d2d,#ff2a00);
    color:#000;
    font-size:24px;
    box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

/* bottom bar（類YouTube Music） */
.bottom{
    display:flex;
    justify-content:space-around;
    padding:10px 0 18px;
    border-top:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
}

.tab{
    font-size:12px;
    opacity:0.6;
}

.tab.active{
    opacity:1;
    color:#ff4d2d;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app" id="app">

    <!-- 上 -->
    <div class="top">
        <div class="cover"></div>
        <div class="title">Milk Tea</div>
        <div class="artist">特製奶茶 · Ynotpiano</div>
    </div>

    <!-- 進度 -->
    <div class="progress">
        <input type="range" id="progress" min="0" max="100" value="0"/>
    </div>

    <!-- 控制 -->
    <div class="controls">
        <button onclick="back()">⏮</button>
        <button class="play" id="btn" onclick="toggle()">▶</button>
        <button onclick="next()">⏭</button>
    </div>

    <!-- bottom nav -->
    <div class="bottom">
        <div class="tab active">Now</div>
        <div class="tab">Explore</div>
        <div class="tab">Library</div>
    </div>

</div>

<audio id="audio" src="music.mp3" preload="metadata"></audio>

<script>
const audio = document.getElementById("audio");
const app = document.getElementById("app");
const btn = document.getElementById("btn");
const progress = document.getElementById("progress");

/* 播放 */
function toggle(){
    if(audio.paused){
        audio.play();
        app.classList.add("playing");
        btn.textContent="⏸";
    }else{
        audio.pause();
        app.classList.remove("playing");
        btn.textContent="▶";
    }
}

/* 進度 */
audio.addEventListener("timeupdate",()=>{
    if(audio.duration){
        progress.value = (audio.currentTime/audio.duration)*100;
    }
});

progress.addEventListener("input",()=>{
    audio.currentTime = (progress.value/100)*audio.duration;
});

/* skip */
function back(){
    audio.currentTime = Math.max(0,audio.currentTime-10);
}

function next(){
    audio.currentTime = Math.min(audio.duration||0,audio.currentTime+10);
}
</script>

</body>
</html>
