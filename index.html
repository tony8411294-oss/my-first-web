<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機計算機</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:Arial;
        }

        body{
            background:#111;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .calculator{
            width:100%;
            max-width:420px;
            padding:15px;
        }

        .screen{
            width:100%;
            height:90px;
            border:none;
            border-radius:20px;
            margin-bottom:15px;
            text-align:right;
            font-size:2rem;
            padding:20px;
            background:#222;
            color:white;
        }

        .buttons{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
        }

        button{
            border:none;
            border-radius:20px;
            height:75px;
            font-size:1.6rem;
            cursor:pointer;
            touch-action:manipulation;
        }

        button:active{
            transform:scale(0.96);
        }

        .operator{
            background:#ff9500;
            color:white;
        }

        .number{
            background:#333;
            color:white;
        }

        .clear{
            background:#666;
            color:white;
        }

        .equal{
            background:#00b894;
            color:white;
        }

        @media (max-width:500px){
            .screen{
                height:80px;
                font-size:1.7rem;
            }

            button{
                height:70px;
                font-size:1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input class="screen" id="screen" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearScreen()">C</button>
            <button class="operator" onclick="add('/')">÷</button>
            <button class="operator" onclick="add('*')">×</button>
            <button class="operator" onclick="backspace()">⌫</button>

            <button class="number" onclick="add('7')">7</button>
            <button class="number" onclick="add('8')">8</button>
            <button class="number" onclick="add('9')">9</button>
            <button class="operator" onclick="add('-')">−</button>

            <button class="number" onclick="add('4')">4</button>
            <button class="number" onclick="add('5')">5</button>
            <button class="number" onclick="add('6')">6</button>
            <button class="operator" onclick="add('+')">+</button>

            <button class="number" onclick="add('1')">1</button>
            <button class="number" onclick="add('2')">2</button>
            <button class="number" onclick="add('3')">3</button>
            <button class="equal" onclick="calculate()" rowspan="2">=</button>

            <button class="number" onclick="add('0')">0</button>
            <button class="number" onclick="add('.')">.</button>

        </div>
    </div>

    <script>
        const screen = document.getElementById("screen")

        function add(value){
            screen.value += value
        }

        function clearScreen(){
            screen.value = ""
        }

        function backspace(){
            screen.value = screen.value.slice(0,-1)
        }

        function calculate(){
            try{
                screen.value = eval(screen.value)
            }catch{
                screen.value = "Error"
            }
        }
    </script>

</body>
</html>
