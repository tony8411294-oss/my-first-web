<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Music Player</title>

<style>
body{
    margin:0;
    height:100vh;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial, sans-serif;
    color:#fff;
}

/* 整體播放器 */
.player{
    width:360px;
    padding:20px;
    border-radius:25px;
    background: linear-gradient(145deg,#111,#000);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
}

/* 黑膠區 */
.vinyl-wrapper{
    position:relative;
    width:260px;
    height:260px;
    margin:0 auto 20px;
}

/* 唱片 */
.vinyl{
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(circle, #222 10%, #000 70%);
    position:relative;
    animation: spin 6s linear infinite;
    animation-play-state: paused;
}

/* 中心封面 */
.vinyl::after{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:110px;
    height:110px;
    border-radius:50%;
    background:url("cover.jpg") center/cover;
    box-shadow:0 0 10px rgba(255,255,255,0.2);
}

/* 黑膠光圈 */
.vinyl::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: repeating-radial-gradient(
        circle,
        rgba(255,255,255,0.05) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0) 6px
    );
}

/* 唱臂 */
.arm{
    position:absolute;
    right:-40px;
    top:20px;
    width:140px;
    height:6px;
    background:#999;
    transform-origin:left;
    transform: rotate(-25deg);
    transition:0.5s;
}

/* 播放狀態 */
.playing .vinyl{
    animation-play-state:running;
}

.playing .arm{
    transform: rotate(0deg);
}

/* 標題 */
.title{
    font-size:22px;
    margin:10px 0 5px;
}

.subtitle{
    font-size:12px;
    opacity:0.6;
}

/* 進度條 */
input[type="range"]{
    width:100%;
    margin:15px 0;
}

/* 控制 */
.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

button{
    background:none;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.play{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#caa76a;
    color:#000;
    font-size:22px;
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="vinyl-wrapper">
        <div class="vinyl"></div>
        <div class="arm"></div>
    </div>

    <div class="title">Milk Tea</div>
    <div class="subtitle">特製奶茶 - Ynotpiano</div>

    <input type="range" id="progress" value="0" min="0" max="100"/>

    <div class="controls">
        <button onclick="rewind()">⏮</button>
        <button class="play" onclick="togglePlay()" id="playBtn">▶</button>
        <button onclick="forward()">⏭</button>
    </div>

    <audio id="audio" src="music.mp3"></audio>
</div>

<script>
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");

function togglePlay(){
    if(audio.paused){
        audio.play();
        player.classList.add("playing");
        playBtn.textContent = "⏸";
    }else{
        audio.pause();
        player.classList.remove("playing");
        playBtn.textContent = "▶";
    }
}

audio.ontimeupdate = () => {
    progress.value = (audio.currentTime / audio.duration) * 100;
};

progress.oninput = () => {
    audio.currentTime = (progress.value / 100) * audio.duration;
};

function rewind(){
    audio.currentTime -= 10;
}

function forward(){
    audio.currentTime += 10;
}
</script>

</body>
</html>
