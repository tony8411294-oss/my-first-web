<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milk Tea</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(180deg,#111,#000);
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    width:100%;
    max-width:420px;
    padding:25px;
}

.cover{
    width:100%;
    aspect-ratio:1;

    border-radius:30px;

    background:
    url("cover.jpg") center/cover;

    box-shadow:0 20px 50px rgba(0,0,0,.6);

    animation:spin 10s linear infinite;

    animation-play-state:paused;
}

.cover.playing{
    animation-play-state:running;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.info{
    text-align:center;
    margin-top:30px;
}

.title{
    font-size:2rem;
    font-weight:bold;
}

.artist{
    margin-top:8px;
    opacity:.7;
}

.progress{
    width:100%;
    margin-top:25px;
}

.progress input{
    width:100%;
}

.time{
    display:flex;
    justify-content:space-between;
    opacity:.6;
    margin-top:8px;
    font-size:.9rem;
}

.controls{
    margin-top:35px;

    display:flex;
    justify-content:center;
}

.playBtn{

    width:90px;
    height:90px;

    border:none;
    border-radius:50%;

    font-size:2rem;

    background:white;
    cursor:pointer;
}

.links{

    margin-top:35px;
    text-align:center;
}

.links a{
    color:#aaa;
    text-decoration:none;
    margin:0 10px;
}

</style>
</head>
<body>


<div class="player">

    <div class="cover" id="cover"></div>

    <div class="info">

        <div class="title">
            Milk Tea
        </div>

        <div class="artist">
            Ynotpiano
        </div>

    </div>


    <div class="progress">

        <input
        type="range"
        value="0"
        id="slider">

        <div class="time">

            <span id="current">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>



    <div class="controls">

        <button
        class="playBtn"
        onclick="togglePlay()"
        id="playBtn">

            ▶

        </button>

    </div>



    <div class="links">

        <a href="#">
            Instagram
        </a>

        <a href="#">
            YouTube
        </a>

    </div>


</div>



<audio
id="audio"
src="music.mp3">
</audio>



<script>

const audio=document.getElementById("audio")
const slider=document.getElementById("slider")
const playBtn=document.getElementById("playBtn")
const cover=document.getElementById("cover")

const current=document.getElementById("current")
const duration=document.getElementById("duration")

let playing=false


function togglePlay(){

    if(playing){

        audio.pause()

        playBtn.innerHTML="▶"

        cover.classList.remove("playing")

    }else{

        audio.play()

        playBtn.innerHTML="❚❚"

        cover.classList.add("playing")
    }

    playing=!playing
}


audio.addEventListener("loadedmetadata",()=>{

    slider.max=audio.duration

    duration.innerHTML=formatTime(
        audio.duration
    )

})


audio.addEventListener("timeupdate",()=>{

    slider.value=audio.currentTime

    current.innerHTML=formatTime(
        audio.currentTime
    )

})


slider.addEventListener("input",()=>{

    audio.currentTime=slider.value

})


function formatTime(sec){

    let m=Math.floor(sec/60)

    let s=Math.floor(sec%60)

    if(s<10)s="0"+s

    return m+":"+s

}

</script>


</body>
</html>
