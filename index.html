<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultra Music Player</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#1a1a1a,#000);
    font-family:Arial;
    color:#fff;
}

/* 主體 */
.player{
    width:360px;
    max-width:92vw;
    padding:20px;
    border-radius:24px;
    background:linear-gradient(145deg,#111,#000);
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
}

/* ===== 黑膠區 ===== */
.vinyl-area{
    position:relative;
    width:260px;
    height:260px;
    margin:0 auto 15px;
}

/* 黑膠 */
.vinyl{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at center,#111 0%,#000 60%,#111 100%);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,0.05),
      0 15px 40px rgba(0,0,0,0.8);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
}

/* 旋轉 */
@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* CD封面 */
.vinyl::after{
    content:"";
    position:absolute;
    inset:50% auto auto 50%;
    transform:translate(-50%,-50%);
    width:120px;
    height:120px;
    border-radius:50%;
    background:url("cover.jpg") center/cover;
    border:2px solid rgba(255,255,255,0.2);
}

/* 刻紋 */
.vinyl::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: repeating-radial-gradient(
        circle,
        rgba(255,255,255,0.04) 0px,
        transparent 2px,
        transparent 6px
    );
}

/* 唱片反光 */
.glare{
    position:absolute;
    inset:0;
    border-radius:50%;
    background: conic-gradient(from 90deg,
        rgba(255,255,255,0.08),
        transparent 30%,
        rgba(255,255,255,0.05),
        transparent);
    pointer-events:none;
}

/* 唱臂 */
.arm{
    position:absolute;
    right:-50px;
    top:25px;
    width:150px;
    height:6px;
    background:linear-gradient(#ccc,#777);
    border-radius:4px;
    transform-origin:left;
    transform:rotate(-25deg);
    transition:0.4s;
}

/* 播放中 */
.playing .vinyl{ animation-play-state:running; }
.playing .arm{ transform:rotate(0deg); }

/* ===== 音波 ===== */
#wave{
    height:40px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2px;
    margin:10px 0;
}

.bar{
    width:3px;
    height:10px;
    background:#caa76a;
    animation: bounce 1s infinite ease-in-out;
}

@keyframes bounce{
    0%,100%{height:5px;}
    50%{height:35px;}
}

/* ===== 唱針 ===== */
.needle{
    position:absolute;
    right:-30px;
    top:10px;
    width:160px;
    height:8px;
    transform-origin:left;
    transform:rotate(-25deg);
    cursor:pointer;
}

.needle-head{
    width:18px;
    height:18px;
    background:#caa76a;
    border-radius:50%;
    position:absolute;
    right:0;
    top:-5px;
}

/* UI */
.title{font-size:18px;margin-top:10px;}
.subtitle{font-size:12px;opacity:0.6;}

.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
}

button{
    border:none;
    background:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.play{
    width:60px;height:60px;
    border-radius:50%;
    background:#caa76a;
    color:#000;
}

/* 進度條 */
input[type=range]{
    width:100%;
    accent-color:#caa76a;
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="vinyl-area">
        <div class="vinyl"></div>
        <div class="glare"></div>
        <div class="arm" id="arm"></div>

        <div class="needle" id="needle">
            <div class="needle-head"></div>
        </div>
    </div>

    <div id="wave"></div>

    <div class="title">Milk Tea</div>
    <div class="subtitle">特製奶茶 - Ynotpiano</div>

    <input type="range" id="progress" min="0" max="100" value="0"/>

    <div class="controls">
        <button onclick="back()">⏮</button>
        <button class="play" onclick="toggle()" id="btn">▶</button>
        <button onclick="next()">⏭</button>
    </div>

    <audio id="audio" src="music.mp3" preload="metadata"></audio>
</div>

<script>
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const btn = document.getElementById("btn");
const progress = document.getElementById("progress");
const needle = document.getElementById("needle");
const wave = document.getElementById("wave");

/* ===== 音波 ===== */
for(let i=0;i<25;i++){
    let b=document.createElement("div");
    b.className="bar";
    b.style.animationDelay = (i*0.05)+"s";
    wave.appendChild(b);
}

/* ===== Web Audio API ===== */
let ctx, analyser, dataArray;

audio.addEventListener("play",()=>{
    if(!ctx){
        ctx = new AudioContext();
        let src = ctx.createMediaElementSource(audio);
        analyser = ctx.createAnalyser();
        src.connect(analyser);
        analyser.connect(ctx.destination);
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animateWave();
    }
});

function animateWave(){
    requestAnimationFrame(animateWave);
    if(!analyser) return;
    analyser.getByteFrequencyData(dataArray);

    document.querySelectorAll(".bar").forEach((bar,i)=>{
        let v = dataArray[i] || 10;
        bar.style.height = (v/3)+"px";
    });
}

/* ===== 播放控制 ===== */
function toggle(){
    if(audio.paused){
        audio.play();
        player.classList.add("playing");
        btn.textContent="⏸";
    }else{
        audio.pause();
        player.classList.remove("playing");
        btn.textContent="▶";
    }
}

/* ===== 進度 ===== */
audio.ontimeupdate=()=>{
    progress.value = (audio.currentTime/audio.duration)*100;
};

progress.oninput=()=>{
    audio.currentTime = (progress.value/100)*audio.duration;
};

/* ===== 唱針控制 ===== */
needle.onmousedown = (e)=>{
    document.onmousemove = (ev)=>{
        let rect = progress.getBoundingClientRect();
        let percent = Math.min(1, Math.max(0,(ev.clientX-rect.left)/rect.width));
        audio.currentTime = percent * audio.duration;
        progress.value = percent*100;
    };
    document.onmouseup = ()=> document.onmousemove=null;
};

/* ===== 按鈕 ===== */
function back(){ audio.currentTime-=10; }
function next(){ audio.currentTime+=10; }
</script>

</body>
</html>
