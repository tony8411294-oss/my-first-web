<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milk Tea</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0d0d0d;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    width:100%;
    max-width:420px;
    padding:25px;
}

.album{
    position:relative;
    width:300px;
    height:300px;
    margin:auto;
}

/* 黑膠 */

.vinyl{

    position:absolute;

    width:280px;
    height:280px;

    right:-80px;
    top:10px;

    border-radius:50%;

    background:
    radial-gradient(circle,#111 8%,#444 9%,#111 10%),
    repeating-radial-gradient(
        circle,
        #111 0px,
        #111 4px,
        #222 5px,
        #111 6px
    );

    box-shadow:0 0 30px rgba(0,0,0,.8);

    z-index:1;

    animation:spin 4s linear infinite;
    animation-play-state:paused;
}

.vinyl.playing{
    animation-play-state:running;
}


/* 封面 */

.cover{

    position:absolute;

    width:100%;
    height:100%;

    z-index:2;

    border-radius:25px;

    background:
    url("cover.jpg")
    center/cover;

    box-shadow:0 20px 40px rgba(0,0,0,.5);
}

.cover.playing{
    animation:float 2s ease-in-out infinite;
}



@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}


@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-6px);
    }
}


.info{
    margin-top:40px;
    text-align:center;
}

.title{
    font-size:2rem;
    font-weight:bold;
}

.artist{
    margin-top:8px;
    opacity:.7;
}


.progress{
    width:100%;
    margin-top:25px;
}

.progress input{
    width:100%;
}


.controls{
    margin-top:30px;
    text-align:center;
}


.playBtn{

    width:85px;
    height:85px;

    border:none;
    border-radius:50%;

    font-size:2rem;

    cursor:pointer;
}


</style>
</head>
<body>



<div class="player">

    <div class="album">

        <div
        class="vinyl"
        id="vinyl">
        </div>

        <div
        class="cover"
        id="cover">
        </div>

    </div>



    <div class="info">

        <div class="title">
            Milk Tea
        </div>

        <div class="artist">
            Ynotpiano
        </div>

    </div>



    <div class="progress">

        <input
        type="range"
        id="slider"
        value="0">

    </div>



    <div class="controls">

        <button
        class="playBtn"
        onclick="togglePlay()"
        id="btn">

            ▶

        </button>

    </div>



</div>



<audio
id="audio"
src="music.mp3">
</audio>



<script>

const audio=document.getElementById("audio")

const vinyl=document.getElementById("vinyl")

const cover=document.getElementById("cover")

const btn=document.getElementById("btn")

const slider=document.getElementById("slider")

let playing=false



function togglePlay(){

    if(playing){

        audio.pause()

        btn.innerHTML="▶"

        vinyl.classList.remove("playing")

        cover.classList.remove("playing")

    }else{

        audio.play()

        btn.innerHTML="❚❚"

        vinyl.classList.add("playing")

        cover.classList.add("playing")
    }

    playing=!playing
}



audio.addEventListener(
"loadedmetadata",
()=>{

    slider.max=
    audio.duration

})


audio.addEventListener(
"timeupdate",
()=>{

    slider.value=
    audio.currentTime

})


slider.addEventListener(
"input",
()=>{

    audio.currentTime=
    slider.value

})

</script>


</body>
</html>
