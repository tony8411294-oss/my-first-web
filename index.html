<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Luxury Vinyl Player</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#1a1a1a,#000);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
}

/* 主體 */
.player{
    width:380px;
    max-width:92vw;
    padding:26px;
    border-radius:30px;
    background: linear-gradient(145deg,#161616,#050505);
    box-shadow:
        0 40px 100px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.05);
    text-align:center;
}

/* ===== 黑膠區 ===== */
.vinyl-area{
    position:relative;
    width:290px;
    height:290px;
    margin:0 auto 18px;
}

/* 黑膠 */
.vinyl{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;

    /* 封面鋪滿黑膠 */
    background:
        radial-gradient(circle at center,
            rgba(0,0,0,0.15) 0%,
            rgba(0,0,0,0.55) 60%,
            rgba(0,0,0,0.95) 100%),
        url("cover.jpg") center/cover no-repeat;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.8),
        inset 0 0 35px rgba(0,0,0,0.85);

    /* 🔥 轉速已調慢（重點） */
    animation: spin 18s linear infinite;
    animation-play-state: paused;

    overflow:hidden;
}

/* 旋轉動畫 */
@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* 黑膠細紋 */
.vinyl::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background: repeating-radial-gradient(
        circle,
        rgba(255,255,255,0.04) 0px,
        transparent 1px,
        transparent 5px
    );
    opacity:0.35;
}

/* 光澤 */
.vinyl::after{
    content:"";
    position:absolute;
    inset:-40%;
    background: radial-gradient(circle at 30% 30%,
        rgba(255,255,255,0.25),
        transparent 55%);
    transform: rotate(25deg);
    pointer-events:none;
}

/* 中心孔 */
.hole{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle,#111,#000);
    box-shadow: inset 0 0 6px rgba(255,255,255,0.1);
}

/* 唱臂 */
.arm{
    position:absolute;
    right:-60px;
    top:30px;
    width:170px;
    height:6px;
    background: linear-gradient(90deg,#d8d8d8,#888);
    border-radius:4px;
    transform-origin:left;
    transform:rotate(-28deg);
    transition:0.5s;
    box-shadow:0 6px 14px rgba(0,0,0,0.5);
}

/* 播放狀態 */
.playing .vinyl{
    animation-play-state:running;
}

.playing .arm{
    transform:rotate(0deg);
}

/* ===== 文字 ===== */
.title{
    font-size:20px;
    margin-top:8px;
    letter-spacing:0.6px;
}

.subtitle{
    font-size:12px;
    opacity:0.45;
    margin-bottom:12px;
}

/* ===== 進度條 ===== */
input[type=range]{
    width:100%;
    accent-color:#caa76a;
    margin:10px 0 18px;
}

/* ===== 控制鍵 ===== */
.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

button{
    border:none;
    background:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    opacity:0.85;
    transition:0.2s;
}

button:hover{
    opacity:1;
    transform:scale(1.05);
}

/* 播放鍵 */
.play{
    width:66px;
    height:66px;
    border-radius:50%;
    background: radial-gradient(circle at top,#e0c36a,#b08d2f);
    color:#111;
    font-size:22px;
    box-shadow:0 18px 40px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="vinyl-area">
        <div class="vinyl"></div>
        <div class="hole"></div>
        <div class="arm"></div>
    </div>

    <div class="title">Milk Tea</div>
    <div class="subtitle">特製奶茶 - Ynotpiano</div>

    <input type="range" id="progress" min="0" max="100" value="0"/>

    <div class="controls">
        <button onclick="back()">⏮</button>
        <button class="play" id="btn" onclick="toggle()">▶</button>
        <button onclick="next()">⏭</button>
    </div>

    <audio id="audio" src="music.mp3" preload="metadata"></audio>
</div>

<script>
const audio = document.getElementById("audio");
const player = document.getElementById("player");
const btn = document.getElementById("btn");
const progress = document.getElementById("progress");

/* 播放 / 暫停 */
function toggle(){
    if(audio.paused){
        audio.play();
        player.classList.add("playing");
        btn.textContent="⏸";
    }else{
        audio.pause();
        player.classList.remove("playing");
        btn.textContent="▶";
    }
}

/* 進度更新 */
audio.addEventListener("timeupdate",()=>{
    if(audio.duration){
        progress.value = (audio.currentTime/audio.duration)*100;
    }
});

/* 拖曳進度 */
progress.addEventListener("input",()=>{
    audio.currentTime = (progress.value/100)*audio.duration;
});

/* 快轉 */
function back(){
    audio.currentTime = Math.max(0,audio.currentTime-10);
}

function next(){
    audio.currentTime = Math.min(audio.duration||0,audio.currentTime+10);
}
</script>

</body>
</html>
